<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글로벌 인기 쇼츠 리포트</title>
<style>
  :root {
    --bg: #0f1117; --card: #171a23; --card-2: #1e2230; --border: #2a2f3f;
    --text: #eef0f5; --text-dim: #9aa1b4; --accent: #ff3b6b; --accent-2: #6c8fff; --ok: #35d488;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #201a2e 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display:flex; justify-content: space-between; align-items:center; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
  .title { display:flex; align-items:center; gap:12px; }
  .logo { width:40px; height:40px; border-radius:12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-size:20px; }
  h1 { font-size: 20px; margin:0; }
  .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .updated { font-size: 12.5px; color: var(--text-dim); background: var(--card-2); border:1px solid var(--border); padding: 8px 14px; border-radius: 10px; }

  .summary-pills { display:flex; gap:10px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { background: var(--card); border:1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size:12.5px; }
  .pill b { font-size: 18px; display:block; color: var(--accent-2); }

  .toolbar { display:flex; gap:10px; flex-wrap: wrap; align-items:center; margin-bottom: 14px; }
  select, input[type=text] {
    background: var(--card-2); border:1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none;
  }

  .card { background: var(--card); border:1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--text); }
  td a { color: var(--accent-2); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .view-count { font-variant-numeric: tabular-nums; font-weight: 700; color: #ffd166; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .empty { padding: 60px 20px; text-align:center; color: var(--text-dim); }
  footer { text-align:center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }
  .rank { color: var(--text-dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <div class="logo">🎬</div>
      <div>
        <h1>글로벌 인기 쇼츠 리포트</h1>
        <div class="sub">전세계 언어권별 최근 인기 유튜브 쇼츠 (조회수 기준)</div>
      </div>
    </div>
    <div class="updated" id="updatedAt">불러오는 중...</div>
  </header>

  <div class="summary-pills" id="summaryPills"></div>

  <div class="toolbar">
    <select id="runSelector" title="조사 시점 선택"></select>
    <input type="text" id="searchBox" placeholder="채널명, 영상제목 검색...">
    <select id="countryFilter"><option value="">전체 국가</option></select>
  </div>

  <div class="card">
    <table id="dataTable">
      <thead>
        <tr>
          <th data-key="rank">#</th>
          <th data-key="country">국가</th>
          <th data-key="channel_title">채널명</th>
          <th data-key="video_title">영상제목</th>
          <th data-key="view_count">조회수</th>
          <th data-key="orientation">형태</th>
          <th data-key="published_at">게시일</th>
          <th>링크</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">아직 수집된 데이터가 없습니다. 로컬 프로그램에서 조사를 먼저 실행해주세요.</div>
  </div>

  <footer>이 페이지는 로컬 수집 프로그램이 실행될 때마다 자동으로 갱신됩니다.</footer>
</div>

<script>
let allRows = [];
let sortKey = 'view_count';
let sortDir = -1;

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

function render() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const country = document.getElementById('countryFilter').value;

  let rows = allRows.filter(r => {
    const matchesQuery = !q || (r.channel_title || '').toLowerCase().includes(q) || (r.video_title || '').toLowerCase().includes(q);
    const matchesCountry = !country || r.country === country;
    return matchesQuery && matchesCountry;
  });

  rows.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'number') return (av - bv) * sortDir;
    return String(av || '').localeCompare(String(bv || '')) * sortDir;
  });

  const body = document.getElementById('tableBody');
  document.getElementById('emptyState').style.display = rows.length ? 'none' : 'block';

  body.innerHTML = rows.map((r, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td>${escapeHtml(r.country)}</td>
      <td>${r.channel_url ? `<a href="${r.channel_url}" target="_blank">${escapeHtml(r.channel_title)}</a>` : escapeHtml(r.channel_title)}</td>
      <td>${escapeHtml(r.video_title)}</td>
      <td class="view-count">${(r.view_count || 0).toLocaleString()}</td>
      <td>${escapeHtml(r.orientation || '-')}</td>
      <td>${(r.published_at || '').slice(0, 10)}</td>
      <td><a href="${r.video_url}" target="_blank">보기 →</a></td>
    </tr>
  `).join('');
}

document.querySelectorAll('#dataTable th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (key === 'rank') return;
    if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
    render();
  });
});
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('countryFilter').addEventListener('change', render);

function applyData(rows, label) {
  allRows = rows || [];
  document.getElementById('updatedAt').textContent = '조사 시점: ' + (label || '-');

  const countries = [...new Set(allRows.map(r => r.country))].sort();
  const sel = document.getElementById('countryFilter');
  sel.innerHTML = '<option value="">전체 국가</option>';
  countries.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });

  const totalViews = allRows.reduce((s, r) => s + (r.view_count || 0), 0);
  document.getElementById('summaryPills').innerHTML = `
    <div class="pill"><b>${allRows.length}</b>수집된 영상 수</div>
    <div class="pill"><b>${countries.length}</b>조사된 언어권 수</div>
    <div class="pill"><b>${totalViews.toLocaleString()}</b>총 조회수 합계</div>
  `;

  render();
}

let latestData = null;

document.getElementById('runSelector').addEventListener('change', function() {
  const file = this.value;
  if (file === '__latest__') {
    applyData(latestData.rows, latestData.updated_at + ' (최신)');
    return;
  }
  fetch('./' + file + '?_=' + Date.now())
    .then(res => res.json())
    .then(run => applyData(run.rows, run.run_at))
    .catch(() => alert('해당 시점의 기록을 불러오지 못했습니다.'));
});

fetch('./data.json?_=' + Date.now())
  .then(res => res.json())
  .then(data => {
    latestData = data;

    const runSel = document.getElementById('runSelector');
    const latestOpt = document.createElement('option');
    latestOpt.value = '__latest__';
    latestOpt.textContent = '최신 (' + (data.updated_at || '-') + ')';
    runSel.appendChild(latestOpt);

    (data.runs || []).forEach((r, i) => {
      if (i === 0) return; // 첫 항목은 최신과 동일
      const opt = document.createElement('option');
      opt.value = r.file;
      opt.textContent = r.run_at + ' (' + r.count + '개)';
      runSel.appendChild(opt);
    });

    applyData(data.rows, (data.updated_at || '-') + ' (최신)');
  })
  .catch(() => {
    document.getElementById('updatedAt').textContent = '데이터를 불러오지 못했습니다.';
    document.getElementById('emptyState').style.display = 'block';
  });
</script>
</body>
</html>
